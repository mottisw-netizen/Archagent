[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archagent"
version = "0.1.0"
description = "AI municipal permit drawing review and correction agent (Hebrew and English)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
claude-code = ["claude-agent-sdk>=0.2"]
# A plain .dxf, headless - no CAD seat, no AutoCAD add-in. A real .dwg needs
# the free ODA File Converter on PATH too (not a pip package; see
# archagent.drawing.dxf_model).
dxf = ["ezdxf>=1.3"]
dev = ["pytest>=7", "anthropic>=1.0", "fastapi>=0.110", "uvicorn>=0.27",
       "python-multipart>=0.0.9", "httpx2", "claude-agent-sdk>=0.2", "ezdxf>=1.3"]

[project.scripts]
archagent = "archagent.cli:main"
archagent-web = "archagent.web.server:main"
archagent-host = "archagent.drawing.mock_host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"archagent.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
