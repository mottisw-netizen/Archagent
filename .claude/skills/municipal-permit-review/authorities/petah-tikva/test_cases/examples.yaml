  expected_pattern: "קו תיעול עירוני"
- text: "יש לסמן את שוחת השהייה בתכנית הפיתוח"
  department: roads_drainage
  expected_pattern: "שוחת השהייה"
- text: "אבן שפה מונמכת בכניסה לחניון"
  department: roads_drainage
  expected_pattern: "אבן שפה מונמכת"
